name: README check

# Revisa el formato del Markdown y que todos los enlaces e imágenes del README
# respondan. La ejecución semanal detecta servicios externos caídos (tarjetas,
# badges, iconos) antes de que alguien vea un perfil roto.

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint.json"
      - ".lycheeignore"
      - ".github/workflows/readme-check.yml"
  pull_request:
    paths:
      - "**.md"
      - ".markdownlint.json"
      - ".lycheeignore"
      - ".github/workflows/readme-check.yml"
  schedule:
    - cron: "0 12 * * 1" # lunes, 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Formato Markdown
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            README.md
            CONTRIBUTING.md

  links:
    name: Enlaces e imágenes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200..=299,429
            README.md CONTRIBUTING.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
