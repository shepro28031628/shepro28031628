name: README check

# Revisa el formato del Markdown y que todos los enlaces e imágenes del README
# respondan. La ejecución semanal detecta servicios externos caídos (tarjetas,
# badges, iconos) antes de que alguien vea un perfil roto.

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint.json"
      - ".lycheeignore"
      - ".github/workflows/readme-check.yml"
  pull_request:
    paths:
      - "**.md"
      - ".markdownlint.json"
      - ".lycheeignore"
      - ".github/workflows/readme-check.yml"
  schedule:
    - cron: "0 12 * * 1" # lunes, 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Formato Markdown
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            README.md
            CONTRIBUTING.md

  links:
    name: Enlaces e imágenes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verificar enlaces
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 403 = el sitio bloquea bots (la página existe); 429 = límite de peticiones.
          args: >-
            --no-progress
            --max-retries 3
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
            --accept 200..=299,403,429
            README.md CONTRIBUTING.md
          output: lychee/out.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cada enlace roto aparece como anotación en la pestaña Actions.
      - name: Reportar enlaces rotos
        if: steps.lychee.outputs.exit_code != 0
        run: |
          grep -E '^\s*[*-] \[' lychee/out.md | while IFS= read -r line; do
            echo "::error title=Enlace roto::${line#*\* }"
          done
          exit 1
