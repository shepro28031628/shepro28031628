name: Profile assets

# Genera la serpiente y el gráfico 3D de contribuciones y los publica en la
# rama `output`. Así `main` no recibe commits automáticos diarios y nunca
# tendrás que hacer `git pull` antes de subir tus propios cambios.

on:
  schedule:
    - cron: "0 0 * * *" # diario, 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar serpiente de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generar gráfico 3D de contribuciones
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Reunir archivos
        run: cp -r profile-3d-contrib dist/

      # Si un paso anterior falla no se publica nada y la rama `output`
      # conserva la última versión buena.
      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
