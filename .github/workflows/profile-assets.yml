name: Profile assets

# Genera la serpiente, el gráfico 3D y las tarjetas de estadísticas y los
# publica en la rama `output`. Así `main` no recibe commits automáticos y el
# README no depende de servicios externos que pueden caerse.

on:
  schedule:
    - cron: "0 0 * * *" # diario, 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar serpiente de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generar gráfico 3D de contribuciones
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generar tarjetas de estadísticas
        uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: tokyonight
          TIME_ZONE: America/Bogota # zona horaria de la tarjeta "horario productivo"
          AUTO_PUSH: false

      - name: Reunir archivos
        run: cp -r profile-3d-contrib profile-summary-card-output dist/

      # Si un paso anterior falla no se publica nada y la rama `output`
      # conserva la última versión buena.
      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
